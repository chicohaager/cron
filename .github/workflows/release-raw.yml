name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: i18n keys must be complete in every language
        run: python3 tools/check-i18n.py

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - run: ./build.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: cron-${{ matrix.arch }}
          path: |
            cron-${{ matrix.arch }}.raw
            cron-${{ matrix.arch }}.raw.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Keep cron.raw — the asset name v0.2.0 shipped and zpkg installed (asset resolution of zpkg is not documented)
        run: cp dist/cron-amd64.raw dist/cron.raw && (cd dist && sha256sum cron.raw > cron.raw.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

# Gemeinsame golangci-lint-Konfiguration (Vorlage: ~/dev/lint-vorlagen/golangci.yml)
# Prüfen: golangci-lint run ./...   Formatieren: golangci-lint fmt
version: "2"

linters:
  default: standard            # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose                # HTTP-Body nicht geschlossen
    - errorlint                # Fehlervergleich ohne errors.Is/As
    - nilerr                   # err geprüft, aber nil zurückgegeben
    - noctx                    # HTTP-/SQL-Aufruf ohne Context
    - rowserrcheck             # rows.Err() nicht geprüft
    - sqlclosecheck            # Rows/Stmt nicht geschlossen
    - unconvert                # überflüssige Typumwandlung
    - copyloopvar              # Schleifenvariablen-Kopie seit Go 1.22 unnötig
    - usestdlibvars            # "GET" statt http.MethodGet usw.
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    generated: lax
    presets:
      - std-error-handling      # fmt.Println & Co. ohne errcheck
    rules:
      - path: _test\.go
        linters: [errcheck, bodyclose, noctx]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
